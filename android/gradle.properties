org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m
android.useAndroidX=true
org.gradle.daemon=true

# Disable Flutter Impeller renderer.
# ARCore/SceneView Filament manages its own GL/Vulkan context.
# Impeller's Vulkan surface conflicts with Filament (AHardwareBuffer error -2).
# Forcing Skia (legacy renderer) resolves the GPU surface conflict.
flutter.experimentalEnableJvmRunner=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
# tflite_flutter 0.12.1 compiles its Java sources at 11 while the Kotlin
# toolchain targets 17; relax the strict validation instead of patching the
# plugin (D8 desugars the mixed bytecode fine at minSdk 26).
kotlin.jvm.target.validation.mode=warning
