<?xml version="1.0" encoding="UTF-8"?>
<!-- SolarSense product flow — animated (rendered on the README via raw.githubusercontent.com). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" role="img" aria-labelledby="title desc">
  <title id="title">SolarSense on-device solar workflow</title>
  <desc id="desc">Animated flow from camera motion to ARCore plane and depth, YOLOv8n obstacle AI, usable area x PVGIS irradiance x PM Surya Ghar subsidies, and a 16-page PDF report.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#F0F9FF" />
      <stop offset="1" stop-color="#ECFDF5" />
    </linearGradient>
    <linearGradient id="bgGlow" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#BAE6FD" stop-opacity="0" />
      <stop offset="1" stop-color="#A7F3D0" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="shimmer" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.45" />
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#164E63" flood-opacity=".12" />
    </filter>
    <filter id="glow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="1000" height="220" rx="24" fill="url(#bg)" />

  <rect width="1000" height="220" rx="24" fill="url(#bgGlow)">
    <animate attributeName="opacity" values="0;1;0" dur="6s" repeatCount="indefinite" />
  </rect>

  <g>
    <rect width="1000" height="220" fill="url(#shimmer)" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="5.5s" begin="0.8s" repeatCount="indefinite" />
      <animateTransform attributeName="transform" type="translate" from="-1000 0" to="1000 0" dur="5.5s" repeatCount="indefinite" />
    </rect>
  </g>

  <g stroke="#67E8F9" stroke-width="4" stroke-linecap="round" fill="none">
    <path d="M180 110H200M360 110H380M540 110H560M720 110H740" stroke-dasharray="10 12">
      <animate attributeName="stroke-dashoffset" from="0" to="-44" dur="1.1s" repeatCount="indefinite" />
    </path>
    <path d="M180 110H200M360 110H380M540 110H560M720 110H740" stroke="#22D3EE" opacity="0.35" stroke-width="1.5" stroke-dasharray="2 6">
      <animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1.1s" repeatCount="indefinite" />
    </path>
  </g>

  <g filter="url(#glow)">
    <circle r="6" fill="#0891B2">
      <animateMotion dur="3.4s" repeatCount="indefinite" path="M180 110H200M360 110H380M540 110H560M720 110H740" />
    </circle>
  </g>
  <circle r="14" fill="#0891B2" opacity="0.25">
    <animateMotion dur="3.4s" repeatCount="indefinite" path="M180 110H200M360 110H380M540 110H560M720 110H740" />
    <animate attributeName="r" values="10;18;10" dur="1.2s" repeatCount="indefinite" />
  </circle>

  <g filter="url(#shadow)">
    <rect x="20" y="55" width="160" height="110" rx="18" fill="#fff" stroke="#A5F3FC" stroke-width="2">
      <animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.2s" fill="freeze" />
    </rect>
    <rect x="200" y="55" width="160" height="110" rx="18" fill="#fff" stroke="#A5F3FC" stroke-width="2">
      <animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.5s" fill="freeze" />
    </rect>
    <rect x="380" y="55" width="160" height="110" rx="18" fill="#fff" stroke="#A5F3FC" stroke-width="2">
      <animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.8s" fill="freeze" />
    </rect>
    <rect x="560" y="55" width="160" height="110" rx="18" fill="#fff" stroke="#A5F3FC" stroke-width="2">
      <animate attributeName="opacity" values="0;1" dur="0.8s" begin="1.1s" fill="freeze" />
    </rect>
    <rect x="740" y="55" width="160" height="110" rx="18" fill="#fff" stroke="#10B981" stroke-width="2.5">
      <animate attributeName="opacity" values="0;1" dur="0.8s" begin="1.4s" fill="freeze" />
      <animate attributeName="stroke-opacity" values="1;0.4;1" dur="2.2s" begin="1.4s" repeatCount="indefinite" />
    </rect>
  </g>
  <rect x="740" y="55" width="160" height="110" rx="18" fill="#10B981" opacity="0.06">
    <animate attributeName="opacity" values="0.06;0.2;0.06" dur="2.2s" begin="1.4s" repeatCount="indefinite" />
  </rect>

  <g fill="#164E63" font-family="Arial, sans-serif" text-anchor="middle">
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.4s" fill="freeze" />
      <text x="100" y="92" font-size="13" font-weight="700">01</text>
      <text x="100" y="119" font-size="16" font-weight="700">Camera + motion</text>
      <text x="100" y="142" font-size="12" fill="#475569">live feed</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.7s" fill="freeze" />
      <text x="280" y="92" font-size="13" font-weight="700">02</text>
      <text x="280" y="119" font-size="16" font-weight="700">ARCore plane + depth</text>
      <text x="280" y="142" font-size="12" fill="#475569">roof mapped in 3D</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.8s" begin="1s" fill="freeze" />
      <text x="460" y="92" font-size="13" font-weight="700">03</text>
      <text x="460" y="119" font-size="16" font-weight="700">YOLOv8n obstacle AI</text>
      <text x="460" y="142" font-size="12" fill="#475569">AC units, water tanks</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.8s" begin="1.3s" fill="freeze" />
      <text x="640" y="92" font-size="13" font-weight="700">04</text>
      <text x="640" y="119" font-size="16" font-weight="700">PVGIS × Surya Ghar</text>
      <text x="640" y="142" font-size="12" fill="#475569">irradiance + subsidies</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.8s" begin="1.6s" fill="freeze" />
      <text x="820" y="92" font-size="13" font-weight="700" fill="#047857">05</text>
      <text x="820" y="119" font-size="16" font-weight="700">PDF report</text>
      <text x="820" y="142" font-size="12" fill="#475569">16 pages, on-device</text>
    </g>
  </g>

  <g>
    <circle cx="100" cy="186" r="4" fill="#22D3EE">
      <animate attributeName="opacity" values="0.15;1;0.15" dur="3.4s" begin="0s" repeatCount="indefinite" />
    </circle>
    <circle cx="280" cy="186" r="4" fill="#22D3EE">
      <animate attributeName="opacity" values="0.15;1;0.15" dur="3.4s" begin="0.85s" repeatCount="indefinite" />
    </circle>
    <circle cx="460" cy="186" r="4" fill="#22D3EE">
      <animate attributeName="opacity" values="0.15;1;0.15" dur="3.4s" begin="1.7s" repeatCount="indefinite" />
    </circle>
    <circle cx="640" cy="186" r="4" fill="#22D3EE">
      <animate attributeName="opacity" values="0.15;1;0.15" dur="3.4s" begin="2.55s" repeatCount="indefinite" />
    </circle>
    <circle cx="820" cy="186" r="4" fill="#10B981">
      <animate attributeName="opacity" values="0.15;1;0.15" dur="3.4s" begin="3.4s" repeatCount="indefinite" />
    </circle>
  </g>
</svg>
