name: solar_sense_ar
description: SolarSense AR — Real-time rooftop solar planning powered by ARCore.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # AR Core integration (no Sceneform)
  ar_flutter_plugin: ^0.7.3

  # State management
  provider: ^6.1.2

  # 3D math (vectors, matrices for AR coordinate handling)
  vector_math: ^2.1.4

  # Runtime camera & storage permissions (pinned to satisfy ar_flutter_plugin)
  permission_handler: ^10.4.5

  # Resolve app documents path for filesystem GLB loading.
  path_provider: ^2.1.5

  # UUID for obstacle / panel IDs
  uuid: ^4.3.3

  cupertino_icons: ^1.0.2
  google_fonts: ^8.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/models/
